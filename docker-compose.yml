version: '3.8'

services:
  # ==========================================
  # Database Service: MongoDB
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: resume2role_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: resume2role
    volumes:
      - mongo_data:/data/db
    networks:
      - resume2role_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Cache Service: Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: resume2role_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - resume2role_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend API Service (Node.js Express)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume2role_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/resume2role
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_resume2role_development_change_in_production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/usr/src/app/uploads
    networks:
      - resume2role_network

  # ==========================================
  # Frontend Client Service (Vite React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: resume2role_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - resume2role_network

# Persistent volumes for database, cache, and uploads
volumes:
  mongo_data:
    name: resume2role_mongo_data
  redis_data:
    name: resume2role_redis_data
  backend_uploads:
    name: resume2role_backend_uploads

networks:
  resume2role_network:
    name: resume2role_network
    driver: bridge
