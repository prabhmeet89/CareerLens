<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded blue tile background -->
  <rect width="32" height="32" rx="6" fill="#0A66C2"/>
  <!-- Magnifying glass circle outline -->
  <circle cx="13.5" cy="13.5" r="6.5" stroke="white" stroke-width="2.2" fill="none"/>
  <!-- Magnifying glass handle -->
  <line x1="18.5" y1="18.5" x2="25" y2="25" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- CL letterform inside the lens -->
  <text x="9.8" y="17.2" font-family="Arial,sans-serif" font-weight="900" font-size="7.5" fill="white">CL</text>
</svg>