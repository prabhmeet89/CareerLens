    <!--
      FOUC Prevention — Theme Class Injection
      ─────────────────────────────────────────────────────────────────────────
      This inline script runs BEFORE React mounts. It reads the stored theme
      preference (or system preference) and immediately sets the `dark` class
      on <html>, preventing a flash of the wrong theme on every page load.
      It MUST remain inline (not deferred / async) to work correctly.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('careerlens-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // Default to dark theme unless user explicitly chose light
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
