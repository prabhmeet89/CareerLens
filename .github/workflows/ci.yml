name: CareerLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # Backend Testing & Coverage
  # ==========================================
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Jest Test Suite with In-Memory MongoDB & Coverage
        working-directory: ./backend
        run: npm run test:coverage
        env:
          CI: true
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_token_12345

  # ==========================================
  # Frontend Build & Lint Verification
  # ==========================================
  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Production Build (Vite)
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: /api
